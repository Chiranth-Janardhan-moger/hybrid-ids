services:
  hybrid-ids:
    build:
      context: .
      dockerfile: Dockerfile
    image: hybrid-ids:1.0
    container_name: hybrid-ids-app
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - ADMIN_API_KEY=${ADMIN_API_KEY:-hybrid-ids-admin-secret}
      - HYBRID_IDS_DB=/app/data/hybrid_ids.db
      - PYTHON_BIN=/opt/venv/bin/python3
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  suricata:
    image: jasonish/suricata:latest
    container_name: hybrid-ids-suricata
    profiles:
      - suricata
      - full
    volumes:
      - ./samples:/pcap:ro
      - ./suricata/rules:/var/lib/suricata/rules:ro
      - ./suricata/logs:/var/log/suricata
    command: >
      -r /pcap/attack_signature.pcap
      -S /var/lib/suricata/rules/local.rules
      -l /var/log/suricata
      -k none
